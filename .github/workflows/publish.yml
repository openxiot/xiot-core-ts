name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # OIDC trusted publishing requires npm >= 11.5.1, but Node 20 and 22 both
      # bundle npm 10.x, so npm is upgraded explicitly below.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.14.0

      - name: Upgrade npm for OIDC
        run: npm install -g npm@^11.5.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.x

      - name: PNPM Install
        run: pnpm install

      - name: Check Version
        run: pnpm version:check

      - name: Build packages
        run: pnpm build

      # No NODE_AUTH_TOKEN on purpose: an empty one makes npm attempt token
      # auth and fail with a bare E404 instead of falling back to OIDC.
      - name: Publish to npm
        working-directory: packages/xiot-core-spec-ts
        run: npm publish --access public